on:
  pull_request:
  push:
    branches: [main]
env:
  DOTNET_NOLOGO: true
jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      - run: dotnet tool restore
      - run: dotnet fable src